name: Notify container repo

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync en repo contenedor
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.CONTAINER_REPO_TOKEN }}" \
            https://api.github.com/repos/jdario9912/tp-integrador-final/dispatches \
            -d '{"event_type":"frontend-updated"}'
