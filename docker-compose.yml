services:
  postgres:
    image: postgres:16-alpine
    container_name: gestion-deportiva
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-gestion-deportiva}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-gestion-deportiva}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # US-44: servidor SMTP de desarrollo. Recibe todos los emails sin enviarlos; se ven en http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  app:
    build: .
    container_name: app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      PORT: ${PORT:-8080}
      # Zona en la que se calcula "hoy" (US-26). ":-" usa la de Argentina también si está vacía en .env
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Argentina/Buenos_Aires}
      # Dentro de la red de Compose se accede a la DB por el nombre del servicio y el puerto interno
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-gestion-deportiva}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      # ":-" usa el valor por defecto también si la variable está vacía en .env (una vacía rompería la app).
      # La clave de desarrollo NO sirve para prod: ahí JWT_SECRET tiene que venir definida
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-no-usar-en-produccion-0123456789}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-2h}
      # Orígenes del front (separados por coma). En prod va el dominio real del front, no el de desarrollo
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Supabase Storage (US-37): vacías en dev, el almacenamiento responde 503 "no disponible"
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-}
      STORAGE_SIGNED_URL_TTL: ${STORAGE_SIGNED_URL_TTL:-10m}
      # US-44: dentro de la red de Compose el SMTP es el servicio mailpit
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@gestion-deportiva.local}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:5173/reset-password}
      PASSWORD_RESET_TOKEN_TTL: ${PASSWORD_RESET_TOKEN_TTL:-30m}
      # US-47: evaluación diaria de alertas
      ALERTS_SCHEDULER_ENABLED: ${ALERTS_SCHEDULER_ENABLED:-true}
      ALERTS_SCHEDULER_CRON: ${ALERTS_SCHEDULER_CRON:-0 0 6 * * *}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"

volumes:
  postgres_data: