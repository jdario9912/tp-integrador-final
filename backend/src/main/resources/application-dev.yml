spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:gestion-deportiva}
    username: ${POSTGRES_USER:user}
    password: ${POSTGRES_PASSWORD:password123}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

app:
  security:
    jwt:
      # Solo para desarrollo y tests. En prod JWT_SECRET es obligatorio
      secret: ${JWT_SECRET:dev-only-secret-no-usar-en-produccion-0123456789}
  cors:
    # El front de `pnpm dev`. Con el proxy de Vite no hace falta, pero sí si VITE_API_URL apunta directo a la API
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoint:
    health:
      # En dev conviene ver el detalle de cada chequeo (DB, disco, etc.)
      show-details: always

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG