spring:
  application:
    name: ${APP_NAME:api-gestion-deportiva}
  config:
    # Spring no lee .env por sí solo; lo importamos para correr la app fuera de Docker Compose.
    # "optional:" evita fallar si el archivo no existe (prod, CI, imagen Docker)
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    web:
      pageable:
        # Un ?size mayor se limita a este valor en lugar de traer todos los registros de una vez
        max-page-size: 100

app:
  security:
    jwt:
      # Sin valor por defecto: si falta JWT_SECRET la app no arranca (en dev lo define application-dev.yml).
      # Mínimo 32 bytes; generarlo con: openssl rand -base64 32
      secret: ${JWT_SECRET}
      issuer: ${spring.application.name}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      # Se renueva en cada refresh: con 2 h sin usar la app hay que volver a iniciar sesión
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:2h}
  cors:
    # Orígenes del front que pueden llamar a la API desde el navegador, separados por coma (US-04).
    # Sin valor por defecto: si falta CORS_ALLOWED_ORIGINS la app no arranca (en dev lo define application-dev.yml)
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  storage:
    supabase:
      # Supabase Storage (US-37). Opcionales en dev: sin ellas la app arranca y el almacenamiento
      # responde 503 "no disponible". En prod son obligatorias (application-prod.yml).
      url: ${SUPABASE_URL:}
      # Clave service_role: solo en .env o variables de entorno, nunca en el repo ni en el front
      service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
      bucket: ${SUPABASE_STORAGE_BUCKET:}
      # Vencimiento de las URLs firmadas de lectura
      signed-url-ttl: ${STORAGE_SIGNED_URL_TTL:10m}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
