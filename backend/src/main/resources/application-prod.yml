spring:
  datasource:
    # Sin valores por defecto: si falta alguna variable, la app falla al arrancar
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  # US-44: sin valor por defecto, si falta MAIL_HOST la app no arranca
  mail:
    host: ${MAIL_HOST}
  jpa:
    hibernate:
      # El esquema se maneja con migraciones, Hibernate solo valida
      ddl-auto: validate
    show-sql: false

app:
  security:
    password-reset:
      # Sin valores por defecto: la página del front y el remitente reales
      reset-url: ${PASSWORD_RESET_URL}
      mail-from: ${MAIL_FROM}
  storage:
    supabase:
      # Sin valores por defecto: si falta alguna variable de Supabase, la app falla al arrancar
      url: ${SUPABASE_URL}
      service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
      bucket: ${SUPABASE_STORAGE_BUCKET}

management:
  endpoint:
    health:
      # No exponer detalles internos al exterior
      show-details: never

springdoc:
  # No exponer la documentación de la API en producción
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    # Cambiá este paquete por el de tu aplicación
    com.gestion_deportiva.api: INFO