name: Unit test, e2e test and build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-test:
    name: Unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Unit test
        run: ./gradlew test -PexcludeE2e

  e2e-test:
    name: E2E test
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: E2E test
        run: ./gradlew test --tests 'com.gestion_deportiva.api.e2e.*'

  build:
    name: Build
    needs: e2e-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build -x test

  docker-compose:
    name: Docker compose up
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker compose up
        run: docker compose up -d --build

  docker-publish:
    name: Publicar imagen en Docker Hub
    needs: docker-compose
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generar tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: jdario9912/gestion-deportiva
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max